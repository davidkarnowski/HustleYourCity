name: Automated Data Export, LLM Inference, and Dashboard Update

on:
  schedule:
    # Los Angeles times converted to UTC (during PST, UTC−8)
    - cron: "10 15 * * *"   # 7:10 AM LA (15:10 UTC)
    - cron: "10 19 * * *"   # 11:10 AM LA (19:10 UTC)
    - cron: "10 23 * * *"   # 3:10 PM LA (23:10 UTC)
    - cron: "10 3 * * *"    # 7:10 PM LA (03:10 UTC next day)
    - cron: "10 7 * * *"    # 11:10 PM LA (07:10 UTC next day)
    - cron: "10 11 * * *"   # 3:10 AM LA (11:10 UTC)
  workflow_dispatch:

jobs:
  export_parse_infer_dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1) Export fresh raw data
      - name: Export raw data
        run: python full_exporter.py

      # 2) Prune old city export files (storage control)
      - name: Prune old city export files (keep 7 & <7 days)
        run: |
          echo "Pruning old city export files..."
          find data/ -type f -name 'service_requests_full_*.json.gz' -mtime +7 -delete || true
          ls -tp data/service_requests_full_*.json.gz | grep -v '/$' | tail -n +8 | xargs -I {} rm -- {} || true

      # 3) Parse to summary JSON (creates summary_results_current.json + archive copies)
      - name: Parse summary
        run: python type_status_response_summary.py

      # 4) Run LLM inference
      - name: Run LLM inference (generate 4h/24h/7d/30d/90d text files)
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
        run: |
          python LLM_inference.py

      # 5) Generate dashboards & charts
      - name: Generate dashboards and charts
        run: python generate_dashboard.py

      # 6) Generate about.html page
      - name: Generate About Page
        run: |
          set -e
          echo "Generating About Page..."
          python generate_about_page.py
          echo "✅ About page generated"

      # 7) Single commit + push
      - name: Commit and push all updates
        run: |
          echo "Preparing commit for data + dashboards + charts..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ data/dashboard/ data/charts/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated: data export, LLM summaries, dashboards & charts [skip ci]"
            git push origin main || (git pull --rebase && git push origin main)
          fi
