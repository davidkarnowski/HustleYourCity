name: Daily Social Media Post Make.com Scenario Web Hook Trigger

on:
  schedule:
    # Fixed UTC; ~08:45 PST or ~09:45 PDT. Daily social post.
    - cron: "45 16 * * *"
  workflow_dispatch:

jobs:
  trigger_daily_make:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository (script lives in repo)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimal webhook dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-webhook.txt

      - name: Trigger Make.com daily social post scenario
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_WEBHOOK_KEY: ${{ secrets.MAKE_WEBHOOK_KEY }}
        run: |
          echo "Triggering daily Make.com social automation via Python script..."
          python trigger_make_webhook.py

      - name: Summary
        run: |
          echo "✅ Daily social Make.com webhook triggered successfully" >> $GITHUB_STEP_SUMMARY
