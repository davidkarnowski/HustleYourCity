name: One-Time Archive Cleanup

on:
  workflow_dispatch:   # Allows manual triggering from GitHub UI

jobs:
  migrate_archive:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Required to push moved files back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (none needed, but future-safe)
        run: |
          python -m pip install --upgrade pip

      - name: Run archive migration script
        run: |
          echo "Running cleanup_archive.py..."
          python cleanup_archive.py

      - name: Commit and push migrated archive files
        run: |
          echo "Preparing commit..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit. Archive already migrated?"
          else
            git commit -m "One-time archive migration of summary_stats_* files into year/month directories [skip ci]"
            git push origin main
          fi
