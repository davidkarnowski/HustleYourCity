name: Test LLM Inference Script

on:
  workflow_dispatch:

jobs:
  run-llm-inference:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Allows writing output text files to repo if needed
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LLM inference script
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
        run: |
          echo "Starting LLM inference test run..."
          python LLM_inference.py
          echo "LLM inference script finished."

      # Optional: Commit the generated files so we can inspect them
      - name: Commit updated text outputs
        run: |
          echo "Checking for updates to data/*.txt..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.txt
          if git diff --cached --quiet; then
            echo "No new text summary files to commit"
          else
            git commit -m "Test: LLM inference output files"
            git push origin main || echo "Push skipped (likely test run)"
          fi
