name: Automated Data Export and Summary

on:
  schedule:
    # Los Angeles times converted to UTC (LA is UTC−7 during DST)
    - cron: "10 14 * * *"   # 7:10 AM LA (14:10 UTC)
    - cron: "10 18 * * *"   # 11:10 AM LA (18:10 UTC)
    - cron: "10 22 * * *"   # 3:10 PM LA (22:10 UTC)
    - cron: "10 2 * * *"    # 7:10 PM LA (02:10 UTC next day)
    - cron: "10 6 * * *"    # 11:10 PM LA (06:10 UTC next day)
    - cron: "10 10 * * *"   # 3:10 AM LA (10:10 UTC)
  workflow_dispatch:

jobs:
  export_and_parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run exporter script
        run: |
          echo "Starting full data export..."
          python full_exporter.py

      - name: Prune old city export files (keep 7 most recent + files < 7 days old)
        run: |
          echo "Pruning city export files older than 7 days..."
          find data/ -type f -name 'service_requests_full_*.json.gz' -mtime +7 -delete || true

          echo "Ensuring only last 7 city export snapshots remain..."
          ls -tp data/service_requests_full_*.json.gz | grep -v '/$' | tail -n +8 | xargs -I {} rm -- {} || true

          echo "Prune completed."        

      - name: Run summary parser
        run: |
          echo "Running summary parser..."
          python type_status_response_summary.py

      - name: Duplicate latest summary file as current
        run: |
          echo "Copying latest summary file to summary_results_current.json..."
          latest_file=$(ls -t data/summary_stats_*.json | head -n 1)
          if [ -f "$latest_file" ]; then
            cp "$latest_file" data/summary_results_current.json
            echo "Copied $latest_file to summary_results_current.json"
          else
            echo "No summary_stats_*.json file found to copy."
          fi

      # Trigger Make.com inference workflow
      - name: Trigger Make.com LLM scenario workflow via Python
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_LLM_INFERENCE_SCENARIO_URL }}
          MAKE_WEBHOOK_KEY: ${{ secrets.MAKE_LLM_INFERENCE_SCENARIO_KEY }}
        run: |
          echo "Triggering Make.com inference scenario via Python..."
          python trigger_make_webhook.py

      # Wait 3 minutes for Make.com + GitHub Pages propagation
      - name: Wait for dashboard status input (Make workflow + GitHub Pages)
        run: |
          echo "Waiting 3 minutes for LLM scenario + GitHub Pages update..."
          sleep 180

      - name: Generate dashboards
        run: |
          echo "Generating dashboard HTML files..."
          python generate_dashboard.py

      - name: Commit and push updated data
        id: commit_push
        run: |
          echo "Checking for new or modified data files..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ data/dashboard/
          if git diff --cached --quiet; then
            echo "No new data changes detected. Skipping commit."
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Automated dataset, summary, and dashboard update [skip ci]"
            git push origin main
            echo "Changes pushed successfully."
            echo "updated=true" >> $GITHUB_OUTPUT
          fi
