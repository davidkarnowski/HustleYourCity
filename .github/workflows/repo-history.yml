name: Repo History Maintenance

# Removes raw City exports (data/service_requests_full_*.json[.gz]) from git
# history. Charts, summaries and everything else keep their full history.
#
#   analyze  — report what fills the history (full clone). Read-only.
#   dry-run  — do the whole rewrite on the runner and verify it; push nothing,
#              upload nothing.
#   rewrite  — first save one raw export per month and the old->new commit
#              map to a draft (collaborators-only) release, then rewrite and
#              force-push with a lease. Needs confirm = "REWRITE" and the
#              HISTORY_REWRITE_DEPLOY_KEY secret: the private half of a
#              temporary write deploy key (gh repo deploy-key add
#              --allow-write), removed again after the rewrite. The default
#              token cannot push commits that touch .github/workflows/.
#
# dry-run and rewrite use a partial clone that skips blobs over 5 MB. Every
# raw export is >= 10 MB and every other file in history is < 1 MB, so the
# clone holds the full history minus the raw exports (~1 GB instead of
# ~6 GB). Lazy fetching is disabled while rewriting, so a missing blob fails
# loudly instead of downloading.

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [analyze, dry-run, rewrite]
        default: analyze
      confirm:
        description: 'Type REWRITE to allow the force-push (rewrite mode only)'
        required: false
        default: ""
  push:
    branches: ["maintenance/**"]
    paths:
      - ".github/workflows/repo-history.yml"
      - ".github/scripts/summarize_history.py"

# A rewrite shares the data pipeline's group, so no scheduled run can push
# mid-rewrite. Analyze and dry-run never block the pipeline.
concurrency:
  group: ${{ inputs.mode == 'rewrite' && 'data-pipeline' || 'repo-history' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODE: ${{ inputs.mode || 'dry-run' }}
  RAW_GLOB: data/service_requests_full_*
  BLOB_LIMIT: 5m

jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write   # draft release for the monthly snapshots + commit map
    steps:
      - name: Refuse rewrite without confirmation
        if: env.MODE == 'rewrite' && inputs.confirm != 'REWRITE'
        run: |
          echo "::error::rewrite mode needs confirm = REWRITE"
          exit 1

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          path: tools

      - name: Install git-filter-repo
        run: pipx install git-filter-repo==2.47.0

      - name: Mirror-clone history (partial unless analyzing)
        run: |
          filter=()
          [ "$MODE" = analyze ] || filter=(--filter="blob:limit=$BLOB_LIMIT")
          start=$(date +%s)
          git clone --mirror --quiet "${filter[@]}" "https://github.com/${GITHUB_REPOSITORY}.git" history.git
          echo "Clone took $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh history.git | tee -a "$GITHUB_STEP_SUMMARY"
          git -C history.git for-each-ref --format='%(objectname) %(refname)' refs/heads refs/tags \
            | tee refs-before.txt
          git -C history.git rev-list --count --all > commits-before.txt
          while read -r sha ref; do
            echo "$ref $(git -C history.git rev-parse "$sha^{tree}")"
          done < refs-before.txt > trees-before.txt

      - name: Check that only raw-export blobs are missing
        if: env.MODE != 'analyze'
        env:
          GIT_NO_LAZY_FETCH: "1"
        run: |
          cd history.git
          git rev-list --all --objects --missing=print | sed -n 's/^?//p' | sort -u > ../missing.txt
          git log --all --no-renames --format= --raw --no-abbrev -- "$RAW_GLOB" | awk '{print $4}' \
            | grep -v '^0\{40\}$' | sort -u > ../raw-blobs.txt
          extra=$(comm -23 ../missing.txt ../raw-blobs.txt | wc -l)
          echo "missing blobs: $(wc -l < ../missing.txt), raw-export blobs: $(wc -l < ../raw-blobs.txt), missing non-raw: $extra" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$((extra))" -eq 0 ] || { echo "::error::non-raw blobs are missing; raise BLOB_LIMIT"; exit 1; }

      - name: Analyze
        if: env.MODE == 'analyze'
        run: |
          cd history.git
          git filter-repo --analyze
          {
            echo "# History analysis ($MODE)"
            echo '```'
            git count-objects -vH
            echo "commits: $(git rev-list --count --all)"
            echo '```'
            python3 "$GITHUB_WORKSPACE/tools/.github/scripts/summarize_history.py" filter-repo/analysis
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: env.MODE == 'analyze'
        with:
          name: filter-repo-analysis
          path: history.git/filter-repo/analysis
          retention-days: 30

      - name: Pick one raw export per month (the last of each month)
        if: env.MODE != 'analyze'
        run: |
          git -C history.git log --all --no-renames --diff-filter=A --format='C %H' --name-only -- "$RAW_GLOB" \
            | awk '/^C /{c=$2; next} NF{print c, $0}' \
            | sort -k2 \
            | awk '{m=substr($2, length("data/service_requests_full_")+1, 7); last[m]=$0} END{for (m in last) print last[m]}' \
            | sort -k2 > monthly.txt
          {
            echo "## Monthly raw snapshots to keep"
            echo '```'
            awk '{print $2}' monthly.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p snapshots
          while read -r commit path; do
            out="snapshots/$(basename "$path")"
            git -C history.git cat-file blob "$commit:$path" > "$out"
            case "$out" in *.gz) gzip -t "$out" ;; esac
          done < monthly.txt
          ls -l snapshots

      - name: Save monthly raw snapshots to a draft release
        if: env.MODE == 'rewrite'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="raw-snapshots-monthly-history"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
                 --title "Raw City exports — one per month, before history cleanup" \
                 --notes "The last raw export of each month that was in git history. Each file is a full copy of the City dataset at that time."
          gh release upload "$tag" snapshots/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove raw exports from history
        if: env.MODE != 'analyze'
        env:
          GIT_NO_LAZY_FETCH: "1"
        run: |
          cd history.git
          git filter-repo --force --prune-empty never \
            --invert-paths --path-glob 'data/service_requests_full_*.json.gz' \
                           --path-glob 'data/service_requests_full_*.json'
          git reflog expire --expire=now --all
          git gc --prune=now --quiet
          {
            echo "## After rewrite"
            echo '```'
            git count-objects -vH
            echo "commits: $(git rev-list --count --all)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify
        if: env.MODE != 'analyze'
        env:
          GIT_NO_LAZY_FETCH: "1"
        run: |
          cd history.git
          # Same commit count, no raw exports anywhere, identical tip trees.
          before=$(cat ../commits-before.txt)
          after=$(git rev-list --count --all)
          [ "$after" = "$before" ] || { echo "::error::commit count changed: $before -> $after"; exit 1; }
          left=$(git log --all --no-renames --format= --name-only -- "$RAW_GLOB" | grep -c . || true)
          [ "$left" = 0 ] || { echo "::error::$left raw-export paths remain"; exit 1; }
          while read -r ref tree; do
            now=$(git rev-parse "$ref^{tree}")
            if [ "$now" != "$tree" ]; then
              echo "::error::$ref tip tree changed ($tree -> $now)"; exit 1
            fi
            echo "ok  $ref tip tree unchanged"
          done < ../trees-before.txt
          git fsck --connectivity-only --no-progress
          echo "Verified: $before commits, tips unchanged." | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p ../rewrite-map && cp filter-repo/commit-map filter-repo/ref-map ../refs-before.txt ../rewrite-map/

      - uses: actions/upload-artifact@v7
        if: env.MODE != 'analyze'
        with:
          name: rewrite-map-${{ env.MODE }}
          path: rewrite-map
          retention-days: 30

      - name: Save old->new commit map to the snapshot release
        if: env.MODE == 'rewrite'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd rewrite-map && tar czf "../rewrite-map-$(date -u +%Y%m%d).tar.gz" .)
          gh release upload raw-snapshots-monthly-history rewrite-map-*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Force-push rewritten history (with lease)
        if: env.MODE == 'rewrite'
        env:
          DEPLOY_KEY: ${{ secrets.HISTORY_REWRITE_DEPLOY_KEY }}
          GIT_NO_LAZY_FETCH: "1"
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::HISTORY_REWRITE_DEPLOY_KEY secret is not set"; exit 1; }
          key="$RUNNER_TEMP/rewrite_key"; hosts="$RUNNER_TEMP/github_known_hosts"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" > "$key")
          # GitHub's SSH host keys, fetched over HTTPS from its API.
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$hosts -o StrictHostKeyChecking=yes"
          cd history.git
          args=()
          while read -r old ref; do
            args+=("--force-with-lease=$ref:$old" "$ref:$ref")
          done < ../refs-before.txt
          git push --atomic "git@github.com:${GITHUB_REPOSITORY}.git" "${args[@]}"
          echo "Pushed rewritten refs." | tee -a "$GITHUB_STEP_SUMMARY"
