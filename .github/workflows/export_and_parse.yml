name: Automated Data Export and Summary

on:
  schedule:
    # Los Angeles times converted to UTC (LA is UTC−7 during DST)
    - cron: "10 14 * * *"   # 7:10 AM LA (14:10 UTC)
    - cron: "10 18 * * *"   # 11:10 AM LA (18:10 UTC)
    - cron: "10 22 * * *"   # 3:10 PM LA (22:10 UTC)
    - cron: "10 2 * * *"    # 7:10 PM LA (02:10 UTC next day)
    - cron: "10 6 * * *"    # 11:10 PM LA (06:10 UTC next day)
    - cron: "10 10 * * *"   # 3:10 AM LA (10:10 UTC)
  workflow_dispatch:

jobs:
  export_and_parse:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # repo commits only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements (for full pipeline run)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run exporter script
        run: |
          echo "Starting full data export..."
          python full_exporter.py

      - name: Prune old city export files (keep 7 most recent + files < 7 days old)
        run: |
          echo "Pruning city export files older than 7 days..."
          find data/ -type f -name 'service_requests_full_*.json.gz' -mtime +7 -delete || true

          echo "Ensuring only last 7 export snapshots remain..."
          ls -tp data/service_requests_full_*.json.gz | grep -v '/$' | tail -n +8 | xargs -I {} rm -- {} || true

          echo "✅ Pruning completed."

      - name: Run summary parser
        run: |
          echo "Running summary parser..."
          python type_status_response_summary.py

      - name: Duplicate latest summary file as current
        run: |
          echo "Copying latest summary file to summary_results_current.json..."
          latest_file=$(ls -t data/summary_stats_*.json | head -n 1)
          if [ -f "$latest_file" ]; then
            cp "$latest_file" data/summary_results_current.json
            echo "Copied $latest_file to summary_results_current.json"
          else
            echo "No summary_stats_*.json file found!"
          fi

      # ✅ Safety check: ensure webhook secrets exist BEFORE calling script
      - name: Verify webhook secrets are set
        run: |
          if [ -z "${{ secrets.MAKE_LLM_INFERENCE_SCENARIO_URL }}" ] || [ -z "${{ secrets.MAKE_LLM_INFERENCE_SCENARIO_KEY }}" ]; then
            echo "❌ Missing Make.com webhook secrets — aborting."
            exit 1
          fi

      - name: Trigger Make.com LLM scenario via Python
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_LLM_INFERENCE_SCENARIO_URL }}
          MAKE_WEBHOOK_KEY: ${{ secrets.MAKE_LLM_INFERENCE_SCENARIO_KEY }}
        run: |
          echo "Triggering Make.com inference scenario via Python..."
          python trigger_make_webhook.py

      - name: Wait for LLM inference + Pages update
        run: |
          echo "⏱ Waiting 3 minutes for Make.com + GitHub Pages..."
          sleep 180

      - name: Pull latest repo changes after Make.com updates
        run: |
          echo "Syncing repository with Make.com updates..."
          git config pull.rebase false
          git pull origin main || echo "No remote updates or already synced"

      - name: Generate dashboards
        run: |
          echo "Generating dashboard HTML files..."
          python generate_dashboard.py

      - name: Commit and push updated data
        id: commit_push
        run: |
          echo "Checking for new or modified data files..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ data/dashboard/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Automated dataset, summary, and dashboard update [skip ci]"
            echo "Pushing changes..."
            git push origin main || (
              echo "⚠️ Push failed — pulling latest and retrying..."
              git pull --rebase origin main
              git push origin main
            )
            echo "✅ Changes pushed."
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

