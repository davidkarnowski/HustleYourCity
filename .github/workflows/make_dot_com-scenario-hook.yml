name: Daily Social Media Post Make.com Scenario Web Hook Trigger

on:
  schedule:
    # Runs 8:00 AM Los Angeles (UTC−7 during DST)
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  trigger_daily_make:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository (if script lives in repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-webhook.txt

      - name: Trigger Make.com daily social post scenario
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_WEBHOOK_KEY: ${{ secrets.MAKE_WEBHOOK_KEY }}
        run: |
          echo "Triggering daily Make.com social automation..."
          python trigger_make_webhook.py
