name: Automated Data Export, LLM Inference, and Dashboard Update

on:
  schedule:
    # Los Angeles times converted to UTC
    - cron: "10 14 * * *"   # 7:10 AM LA (14:10 UTC)
    - cron: "10 18 * * *"   # 11:10 AM LA (18:10 UTC)
    - cron: "10 22 * * *"   # 3:10 PM LA (22:10 UTC)
    - cron: "10 2 * * *"    # 7:10 PM LA (02:10 UTC next day)
    - cron: "10 6 * * *"    # 11:10 PM LA (06:10 UTC next day)
    - cron: "10 10 * * *"   # 3:10 AM LA (10:10 UTC)
  workflow_dispatch:

jobs:
  export_parse_infer_dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export raw data
        run: python full_exporter.py

      - name: Prune old city export files (keep 7 & <7 days)
        run: |
          echo "Pruning old city export files..."
          find data/ -type f -name 'service_requests_full_*.json.gz' -mtime +7 -delete || true
          ls -tp data/service_requests_full_*.json.gz | grep -v '/$' | tail -n +8 | xargs -I {} rm -- {} || true

      - name: Parse summary
        run: python type_status_response_summary.py

      - name: Copy latest summary as current
        run: |
          latest_file=$(ls -t data/summary_stats_*.json | head -n 1)
          cp "$latest_file" data/summary_results_current.json
          echo "Copied $latest_file to summary_results_current.json"

      ## ✅ PUSH the fresh JSON BEFORE calling Make
      - name: Commit and push raw + summary data first
        run: |
          echo "Pushing data before LLM inference..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes, skipping early commit"
          else
            git commit -m "Data update before LLM inference [skip ci]"
            git push origin main || (git pull --rebase && git push origin main)
          fi

      ## ✅ WAIT for GH Pages to publish new JSON for Make.com
      - name: Wait for GitHub Pages update (70 seconds)
        run: sleep 70

      ## ✅ Trigger Make.com to read new JSON and write summaries
      - name: Trigger Make.com LLM inference
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_LLM_INFERENCE_SCENARIO_URL }}
          MAKE_WEBHOOK_KEY: ${{ secrets.MAKE_LLM_INFERENCE_SCENARIO_KEY }}
        run: python trigger_make_webhook.py

      ## ⏳ WAIT for Make.com to finish & push to GitHub
      - name: Wait for Make.com to finish (~180 sec)
        run: sleep 180

      ## ✅ PULL new LLM summaries updated by Make.com
      - name: Pull updated repo after Make.com writes summaries
        run: |
          git config pull.rebase false
          git pull origin main || echo "Repo already up to date"

      ## ✅ Generate dashboards based on new summaries
      - name: Generate dashboards
        run: python generate_dashboard.py

      ## ✅ Commit dashboards
      - name: Commit and push dashboards + charts
        run: |
          echo "Pushing dashboard and chart updates..."
          git add data/dashboard/ data/charts/
          if git diff --cached --quiet; then
            echo "No dashboard or chart changes to push"
          else
            git commit -m "Dashboard + chart update after LLM inference [skip ci]"
            git push origin main || (git pull --rebase && git push origin main)
          fi
