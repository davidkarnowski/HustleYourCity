name: Automated Data Export, LLM Inference, and Dashboard Update

on:
  schedule:
    # ----------------------------------------------------------------------
    # Schedule is fixed in UTC. Local-time equivalents drift by 1 hour
    # across U.S. DST transitions (twice a year). Drift is tolerated
    # because the City publishes data every 4 hours and our pipeline
    # cadence (~4 hours) absorbs a 1-hour shift without operational
    # impact. If precise wall-clock alignment becomes important, refactor
    # to use workflow_dispatch + an external scheduler.
    #
    # Equivalent local times (approximate; 1-hour shift during PDT):
    #   15:10 UTC = 07:10 PST / 08:10 PDT
    #   19:10 UTC = 11:10 PST / 12:10 PDT
    #   23:10 UTC = 15:10 PST / 16:10 PDT
    #   03:10 UTC = 19:10 PST / 20:10 PDT (previous LA day)
    #   07:10 UTC = 23:10 PST / 00:10 PDT (previous LA day)
    #   11:10 UTC = 03:10 PST / 04:10 PDT
    #
    # City of Long Beach publishes at 03/07/11 AM/PM PT.
    # Our pipeline fires ~10 min after each PST-equivalent publish window.
    # ----------------------------------------------------------------------
    - cron: "10 15 * * *"
    - cron: "10 19 * * *"
    - cron: "10 23 * * *"
    - cron: "10 3 * * *"
    - cron: "10 7 * * *"
    - cron: "10 11 * * *"
  workflow_dispatch:

jobs:
  export_parse_infer_dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1) Export fresh raw data
      - name: Export raw data
        run: python full_exporter.py

      # 2) Prune old city export files (storage control)
      - name: Prune old city export files (keep 7 & <7 days)
        run: |
          echo "Pruning old city export files..."
          find data/ -type f -name 'service_requests_full_*.json.gz' -mtime +7 -delete || true
          ls -tp data/service_requests_full_*.json.gz | grep -v '/$' | tail -n +8 | xargs -I {} rm -- {} || true

      # 3) Parse to summary JSON (creates summary_results_current.json + archive copies)
      - name: Parse summary
        run: python type_status_response_summary.py

      # 4) Run LLM inference (cascade: Gemini → OpenAI → Archive, per Decision Log D-05)
      - name: Run LLM inference (generate 4h/24h/7d/30d/90d text files)
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          # Phase 2.4: OpenAI is the default secondary cascade target.
          # Mitigates Gemini preview-tier 503-overload events observed
          # in production on 2026-04-30.
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
        run: |
          python LLM_inference.py

      # 5) Generate dashboards & charts
      - name: Generate dashboards and charts
        run: python generate_dashboard.py

      # 6) Generate about.html page
      - name: Generate About Page
        run: |
          set -e
          echo "Generating About Page..."
          python generate_about_page.py
          echo "✅ About page generated"

      # 7) Defensive cleanup: never commit raw exports (Phase 1.2)
      - name: Remove raw exports from working tree before commit
        run: |
          rm -f data/service_requests_full_*.json data/service_requests_full_*.json.gz
          echo "Raw exports removed from working tree (will not be committed)."

      # 8) Single commit + push (explicit staging — see Plan 01 Task 1.2 for rationale)
      - name: Commit and push all updates
        run: |
          echo "Preparing commit for data + dashboards + charts..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only the artifacts intended for the public site.
          # Raw service_requests_full_*.json.gz are intentionally NOT staged
          # (Phase 1.2 — halts the largest contributor to repo bloat).
          git add data/dashboard/ data/charts/
          git add data/summary_results_current.json
          git add data/current_*.txt
          git add data/archive/
          git add data/logs/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated: data export, LLM summaries, dashboards & charts [skip ci]"
            git push origin main || (git pull --rebase && git push origin main)
          fi
