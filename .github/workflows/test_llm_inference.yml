name: Test LLM Inference Script

on:
  workflow_dispatch:

jobs:
  run-llm-inference:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Allows writing output text files to repo if needed
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LLM inference script
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          # Phase 2.4 / Decision Log D-05: OpenAI secondary cascade key.
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Starting LLM inference test run..."
          python LLM_inference.py
          echo "LLM inference script finished."

      # Optional: Commit the generated files so we can inspect them
      - name: Commit updated text outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          .github/scripts/commit_and_push.sh "Test: LLM inference output files" data/current_*.txt
